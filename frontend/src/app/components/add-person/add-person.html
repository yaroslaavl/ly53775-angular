<mat-card class="form-card">
  <mat-card-title>Add person</mat-card-title>

  <form (ngSubmit)="save()" #form="ngForm">
    <mat-form-field appearance="outline">
      <mat-label>First name</mat-label>
      <input matInput [(ngModel)]="person.firstName" name="firstName" required />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Family name</mat-label>
      <input matInput [(ngModel)]="person.familyName" name="familyName" required />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Age</mat-label>
      <input matInput type="number" [(ngModel)]="person.age" name="age" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>City</mat-label>
      <input matInput [(ngModel)]="person.address.city" name="city" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Street</mat-label>
      <input matInput [(ngModel)]="person.address.street" name="street" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Post code</mat-label>
      <input matInput [(ngModel)]="person.address.postCode" name="postCode" />
    </mat-form-field>

    <button mat-raised-button color="primary" type="submit" [disabled]="loading || form.invalid">
      SAVE
    </button>
  </form>
</mat-card>
